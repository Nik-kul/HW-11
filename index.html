<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Домашнє завдання JS</title>
</head>
<body>

    <h1>Перевірте консоль браузера (F12)</h1>

    <script>
        // 1. Змінна age
        let age = 12;
        console.log(age);

        // 2. Змінна name
        let name = "Nikita";
        console.log(name);

        // 3. Змінна isStudent
        let isStudent = true;
        console.log(isStudent);

        // 4. Змінна myString
        let myString = "Ніколи не здавайся!";
        console.log(myString);

        // 5. Змінна myNumber
        let myNumber = 25;
        myNumber = myNumber + 10;
        console.log(myNumber);

        // 6. Змінна myNull
        let myNull = null;
        console.log(myNull);

        // 7. Введення імені через prompt()
        let userName = prompt("Введіть своє ім’я");
        alert("Привіт, " + userName + "!");
        console.log(typeof userName);

        // 8. confirm()
        let userAnswer = confirm("Ви дійсно хочете покинути сторінку?");
        console.log(userAnswer);

        // 9. alert() та confirm()
        alert("Увага! Дія може бути небезпечною.");

        let continueAction = confirm(
            "Ви впевнені, що хочете продовжити?"
        );

        console.log(continueAction);

        if (continueAction) {
            alert("Дію підтверджено.");
        } else {
            alert("Дію скасовано.");
        }
    </script>

</body>
</html>
